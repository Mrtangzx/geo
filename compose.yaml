name: geo-skills

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geo}
      POSTGRES_DB: ${POSTGRES_DB:-geo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/runtime/setup-local.ps1 first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
